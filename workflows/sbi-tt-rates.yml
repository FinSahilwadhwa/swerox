name: Archive SBI TT Rates

on:
  schedule:
    - cron: "30 4 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch SBI TT rates PDF
        run: node scripts/fetch-sbi-tt-rates.js

      - name: Commit archived PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Archive SBI TT rates PDF"
          file_pattern: "20*/*/*.pdf"
