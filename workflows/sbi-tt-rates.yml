name: Archive SBI TT Rates

on:
  schedule:
    - cron: "30 4 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch SBI TT rates PDF
        run: bash run.sh

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "SWEROX SBI TT Rates Updated"
          to: www.sahilwadhwa520@gmail.com
          from: SWEROX Bot
          body: |
            Today's SBI TT rates workflow completed successfully.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Archive folder: sbi-tt-rates/YYYY/MM/YYYY-MM-DD.pdf
            Run ID: ${{ github.run_id }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "SWEROX SBI TT Rates Update Failed"
          to: www.sahilwadhwa520@gmail.com
          from: SWEROX Bot
          body: |
            SBI TT rates workflow FAILED.

            Repository: ${{ github.repository }}
            Run ID: ${{ github.run_id }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

